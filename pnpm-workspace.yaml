packages:
  - apps/*
  - packages/*

# Безопасность цепочки поставки (ADR-0008, угроза T21).
# Карантин новых версий пакетов: 24 ч (по умолчанию в pnpm 11 — фиксируем явно).
minimumReleaseAge: 1440
# Установка падает, если у пакета снизился уровень доверия
# (например, новая версия опубликована без подтверждения происхождения).
trustPolicy: no-downgrade
# Git- и tarball-источники разрешены только прямым зависимостям.
blockExoticSubdeps: true
# Скрипты установки зависимостей — только по явному разрешению.
strictDepBuilds: true
allowBuilds: {}
# Версии Node.js и pnpm — строго из package.json.
engineStrict: true
# Точные версии зависимостей; обновления — через Dependabot.
savePrefix: ""
