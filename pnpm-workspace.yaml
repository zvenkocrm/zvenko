packages:
  - apps/*
  - packages/*

# Безопасность цепочки поставки (ADR-0008, угроза T21).
# Карантин новых версий пакетов — 7 дней: за это время вредоносные версии обычно успевают
# найти и удалить. Срочное исправление уязвимости — через minimumReleaseAgeExclude,
# с пояснением в PR.
minimumReleaseAge: 10080
# Установка падает, если у пакета снизился уровень доверия
# (например, новая версия опубликована без подтверждения происхождения).
trustPolicy: no-downgrade
# Git- и tarball-источники разрешены только прямым зависимостям.
blockExoticSubdeps: true
# Скрипты установки зависимостей — только по явному разрешению.
strictDepBuilds: true
# Проверено 04.10.2026 — скрипты не нужны, запрещены:
#   esbuild — бинарник ставится платформенным пакетом @esbuild/*, скрипт только проверяет его;
#   ssh2, cpu-features — нативные ускорители SSH (через testcontainers), Docker у нас локальный;
#   protobufjs — скрипт проверяет версию.
allowBuilds:
  esbuild: false
  ssh2: false
  cpu-features: false
  protobufjs: false
# Версии Node.js и pnpm — строго из package.json.
engineStrict: true
# Точные версии зависимостей; обновления — через Dependabot.
savePrefix: ""
# Принудительные версии вложенных зависимостей — только с причиной и способом снять.
overrides:
  # drizzle-kit 0.31 тянет через устаревший @esbuild-kit esbuild 0.18 с уязвимостью
  # GHSA-67mh-4wv8-2f99 (dev-сервер esbuild отдаёт ответы любому сайту). Ставим 0.25.12 —
  # ту же версию, что drizzle-kit использует сам. Снять, когда drizzle-kit откажется от @esbuild-kit.
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
